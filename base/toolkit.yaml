# language -> tools, each with why. Claude gets language servers from plugins (base/plugins.yaml); these rows are the checks both hosts can run.
always:
  - tool: rg
    why: Find text quickly
  - tool: fd
    why: Find files quickly
  - tool: jq
    why: Read hook JSON
  - tool: ast-grep
    why: Find code by syntax
  - tool: lefthook
    why: Run Git checks
  - tool: gitleaks
    why: Detect secrets
  - tool: mise
    why: Install latest tools and run tasks
  - tool: yq
    why: Read the setup lists and YAML
  - tool: gh
    why: Work with pull requests, issues, and CI runs
  - tool: semgrep
    why: Find bugs and unsafe code by pattern
  - tool: osv-scanner
    why: Find known-vulnerable dependencies
  - tool: just
    why: Give every agent one set of scoped commands, such as just check
  - tool: actionlint
    why: Check GitHub Actions files before you push
  - tool: hyperfine
    why: Measure speed before and after a change
  - tool: tokei
    why: Size and language profile of an unfamiliar repo
  - tool: SIGIDI (app)
    why: Desktop workspace where Claude Code and Codex run; install from quantipixels/sigidi-release if missing
TS:
  - tool: typescript (tsc)
    why: Type check TypeScript; the Codex stand-in for a language server
  - tool: vite-plus (vp), oxlint, oxfmt
    why: "Vite+ toolchain: vp check, lint (Oxlint), format (Oxfmt)"
Python:
  - tool: uv
    why: runs a repo's Python checks with the dependencies the repo declares
  - tool: pyright
    why: Type check Python; the Codex stand-in for a language server
  - tool: ruff
    why: Python format and lint
Kotlin/Java:
  - tool: gradle or mvn
    why: Compile and test; use the project build as the check
Rust:
  - tool: cargo clippy
    why: Lint and type check Rust (comes with rustup)
  - tool: cargo-nextest
    why: Run Rust tests fast; install with cargo install --locked cargo-nextest
  - tool: cargo-deny
    why: Check Rust dependency licenses and advisories; install with cargo install --locked cargo-deny
Swift:
  - tool: swift build
    why: Compile and type check Swift (comes with Xcode)
Shell:
  - tool: shellcheck
    why: Check shell scripts
  - tool: shfmt
    why: Format shell scripts
