# One row per hook. Scripts live in base/<host>/hooks/. Omit matcher to match every call.
# requires lists programs that must be on PATH before the hook is enabled.
hooks:
  - event: PreToolUse
    matcher: Bash
    command: node "${HOME}/.codex/hooks/shellcheck-validate.mjs"
    requires: [node, shellcheck]
    hosts: [codex]
  - event: PostToolUse
    matcher: Edit|Write|MultiEdit
    command: sh "${HOME}/.claude/hooks/ruff-format.sh"
    timeout: 30
    requires: [jq, ruff]
    hosts: [claude]
  - event: PreToolUse
    matcher: Bash
    command: sh "${HOME}/.claude/hooks/strip-claude-attribution.sh"
    timeout: 10
    requires: [python3]
    hosts: [claude]
  - event: PostToolUse
    matcher: Edit|Write|apply_patch
    command: '[ ! -f "${HOME}/.agents/skills/impeccable/scripts/hook.mjs" ] || node "${HOME}/.agents/skills/impeccable/scripts/hook.mjs"'
    timeout: 5
    status: Checking UI changes
    requires: [node]
    hosts: [codex]
  - event: Stop
    command: '[ ! -f "${HOME}/.agents/skills/impeccable/scripts/hook.mjs" ] || node "${HOME}/.agents/skills/impeccable/scripts/hook.mjs"'
    timeout: 30
    status: Design deep pass
    requires: [node]
    hosts: [codex]
