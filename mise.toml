[settings]
auto_install = false

[settings.task]
run_auto_install = false

[tools]
python = "latest"
node = "latest"
claude = "latest"
codex = "latest"
gh = "latest"
ripgrep = "latest"
fd = "latest"
jq = "latest"
ast-grep = "latest"
lefthook = "latest"
gitleaks = "latest"
shellcheck = "latest"
shfmt = "latest"
"npm:vite-plus" = "latest"
oxlint = "latest"
"npm:oxfmt" = "latest"
ruff = "latest"
yq = "latest"

[tasks.setup]
run = "steps/setup"
[tasks.plan]
run = "steps/diff"
[tasks.doctor]
run = "steps/doctor"
[tasks.capture]
run = "steps/capture"
[tasks.cleanup]
run = "steps/cleanup"
[tasks.toolkit]
run = "steps/toolkit"
[tasks.check]
run = ["shellcheck steps/check-tools steps/render steps/diff steps/apply steps/setup steps/plugins steps/skills steps/toolkit steps/doctor steps/capture steps/cleanup steps/plan base/claude/hooks/*.sh", "gitleaks dir --redact .", "python3 -B -m unittest discover -s tests"]
[tasks."check:shell"]
run = "shellcheck {{arg(name='files', var=true)}}"
[tasks."check:secrets"]
run = "gitleaks git --pre-commit --staged --redact"
[tasks."hooks:install"]
run = "lefthook install"
