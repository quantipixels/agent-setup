name: Check base setup
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
      - run: mise run check
      - name: Scratch setup and doctor
        shell: bash
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/agent-setup.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          export HOME="$scratch"
          export CODEX_HOME="$scratch/.codex"
          export CLAUDE_CONFIG_DIR="$scratch/.claude"
          export MISE_TRUSTED_CONFIG_PATHS="$GITHUB_WORKSPACE"
          mise run setup -- --dry-run --no-login
          mise run setup -- --no-login --yes
          mise run doctor
