name: Check

on:
  pull_request:
  push:
    branches: [ori]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      # Only the tools `mise run check` and the tests use, not the whole toolkit.
      - run: mise install python shellcheck gitleaks yq jq
      - run: mise run check
