name: Check

on:
  pull_request:
  push:
    branches: [ori]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The tests expect the full toolkit, as the README's `mise install` sets it up.
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run check
